<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Display</title>
    <style>
        /* Colours, type and radii match the Face-Dataset-Collector app's light staff theme */
        @font-face {
            font-family: "IBM Plex Sans";
            font-weight: 400;
            src: url("{{ url_for('static', filename='fonts/ibm_plex_sans_regular.ttf') }}");
        }

        @font-face {
            font-family: "IBM Plex Sans";
            font-weight: 500;
            src: url("{{ url_for('static', filename='fonts/ibm_plex_sans_medium.ttf') }}");
        }

        @font-face {
            font-family: "IBM Plex Sans";
            font-weight: 600;
            src: url("{{ url_for('static', filename='fonts/ibm_plex_sans_semibold.ttf') }}");
        }

        :root {
            --ink: #14202b;
            --ink-muted: #46535f;
            --ground: #f3f5f7;
            --surface: #ffffff;
            --line: #d5dbe1;
            --face-ground: #e7ebef;
            --accent: #0b5f63;
            --error: #a32019;
            --warning-fill: #fce9c8;
            --warning-text: #7a3e00;
            --success-fill: #d3f1e5;
            --success-text: #0a4d3c;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            background: var(--ground);
            color: var(--ink);
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        }

        /* Sizes use vh so that the layout holds at any kiosk resolution */
        .screen {
            box-sizing: border-box;
            height: 100%;
            padding: 4.4vh 3.4vw;
            display: flex;
            flex-direction: column;
            gap: 3vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2vw;
        }

        .prompt {
            display: flex;
            align-items: center;
            gap: 1.2vw;
        }

        .prompt svg {
            width: 5.2vh;
            height: 5.2vh;
            flex: none;
        }

        h1 {
            margin: 0;
            font-size: 5.2vh;
            font-weight: 600;
            line-height: 1.15;
        }

        .location {
            font-size: 3vh;
            font-weight: 500;
            color: var(--ink-muted);
        }

        /* One line at the foot of the screen, so any number of camera problems takes the same space from the person cards */
        #camera-status {
            flex: none;
            overflow: hidden;
        }

        #camera-status:empty {
            display: none;
        }

        .chips {
            display: flex;
            gap: 1.2vw;
            width: max-content;
            padding-left: 100%;
            white-space: nowrap;
            animation: marquee linear infinite;
        }

        @keyframes marquee {
            to {
                transform: translateX(-100%);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .chips {
                flex-wrap: wrap;
                width: auto;
                padding-left: 0;
                white-space: normal;
                animation: none;
            }
        }

        .chip {
            flex: none;
            box-sizing: border-box;
            padding: 1.1vh 1vw;
            border-radius: 6px;
            font-size: 2.6vh;
            font-weight: 600;
            line-height: 1.3;
        }

        .chip-error {
            background: var(--warning-fill);
            color: var(--warning-text);
        }

        .chip-success {
            background: var(--success-fill);
            color: var(--success-text);
        }

        main {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .people {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-auto-rows: minmax(0, 1fr);
            gap: 3vh;
        }

        .person {
            min-width: 0;
            min-height: 0;
            box-sizing: border-box;
            padding: 3vh;
            display: flex;
            align-items: center;
            gap: 2vw;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .person img {
            height: 100%;
            aspect-ratio: 1;
            flex: none;
            box-sizing: border-box;
            object-fit: cover;
            background: var(--face-ground);
            border: 0.3vh solid var(--line);
            border-radius: 8px;
        }

        .person.newest img {
            border-color: var(--accent);
        }

        .person-text {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 1.1vh;
        }

        .person-id {
            font-size: 7vh;
            font-weight: 600;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
            overflow-wrap: anywhere;
        }

        .person-tag {
            font-size: 2.4vh;
            font-weight: 500;
            color: var(--ink-muted);
        }

        .person.newest .person-tag {
            font-weight: 600;
            color: var(--accent);
        }

        .centred {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3.7vh;
            text-align: center;
        }

        .face-guide {
            width: 27.8vh;
            height: 35.2vh;
            box-sizing: border-box;
            border: 0.6vh solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .face-guide svg {
            width: 14vh;
            height: 14vh;
        }

        .idle-text {
            font-size: 4vh;
            font-weight: 500;
            color: var(--ink-muted);
        }

        .notice {
            box-sizing: border-box;
            max-width: 78vw;
            padding: 6vh 3.8vw;
            border-radius: 8px;
            font-size: 5.2vh;
            font-weight: 600;
            line-height: 1.3;
            text-wrap: balance;
        }

        .notice-error {
            background: var(--error);
            color: #ffffff;
        }

        .notice-success {
            background: var(--success-fill);
            color: var(--success-text);
        }

        .progress {
            width: 47vw;
            height: 1.5vh;
            border-radius: 0.75vh;
            background: var(--line);
            overflow: hidden;
        }

        .progress div {
            height: 100%;
            border-radius: 0.75vh;
            background: var(--accent);
            animation: fill 120s linear forwards;
        }

        @keyframes fill {
            from {
                width: 0;
            }

            to {
                width: 100%;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>

<body>
    <div class="screen">
        <header>
            <div class="prompt">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#0b5f63" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 8a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <path d="M16 10.5 21 8v8l-5-2.5"></path>
                </svg>
                <h1>Please look into the camera</h1>
            </div>
            <div class="location">{{ location }}</div>
        </header>
        <main id="content"></main>
        <div id="camera-status"></div>
    </div>

    <script type="text/javascript">
        // Must match the text in app.py exactly: it holds this message for 2 minutes
        const STARTING_MESSAGE = "Facial Recognition Attendance System is Getting Started. Please Wait for 2 Minutes";

        const socket = io.connect(); // Same origin, so it works on plain HTTP and behind an HTTPS proxy
        let lastUpdate = Date.now();
        const clearIntervalTime = 15000; // 15 seconds
        let errorMessage = ''; // Store the current error message
        let successMessage = ''; // Store the current success message
        let isErrorPersisted = false; // Flag to check if error message should persist
        let isSuccessPersisted = false; // Flag to check if success message should persist
        let drawnContent = null; // The server repeats itself every 100 ms: redraw only on a change, or the progress bar restarts
        let drawnStatus = null; // The same goes for the marquee

        function element(tag, className, text) {
            const node = document.createElement(tag);
            node.className = className;
            if (text !== undefined) {
                node.textContent = text;
            }
            return node;
        }

        function updateCameraStatus(statuses) {
            const key = JSON.stringify(statuses);
            if (key === drawnStatus) {
                return;
            }
            drawnStatus = key;
            const strip = document.getElementById('camera-status');
            strip.replaceChildren();
            if (statuses.length > 0) {
                const chips = element('div', 'chips');
                chips.replaceChildren(...statuses.map(status =>
                    element('div', status.level === 'ERROR' ? 'chip chip-error' : 'chip chip-success', status.text)
                ));
                strip.appendChild(chips);
                chips.style.animationDuration = chips.offsetWidth / (window.innerHeight * 0.15) + 's'; // Same reading speed however many cameras are listed
            }
        }

        function drawNotice(type, text) {
            const area = element('div', 'centred');
            area.appendChild(element('div', 'notice notice-' + type, text));
            if (text === STARTING_MESSAGE) {
                const progress = element('div', 'progress');
                progress.appendChild(element('div', ''));
                area.appendChild(progress);
            }
            return area;
        }

        function drawIdle() {
            const area = element('div', 'centred');
            const guide = element('div', 'face-guide');
            guide.innerHTML = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#d5dbe1" stroke-width="1.2" stroke-linecap="round"><circle cx="12" cy="8.5" r="4.5"></circle><path d="M4 21c1.2-4.4 4.2-6.5 8-6.5s6.8 2.1 8 6.5"></path></svg>';
            area.appendChild(guide);
            area.appendChild(element('div', 'idle-text', 'Ready for the next person'));
            return area;
        }

        function drawPeople(rows) {
            const grid = element('div', 'people');
            rows.forEach((row, index) => {
                const personId = Object.keys(row)[0];
                const card = element('div', index === 0 ? 'person newest' : 'person');
                const image = element('img', '');
                image.src = "data:image/jpg;base64," + row[personId];
                image.alt = '';
                const text = element('div', 'person-text');
                text.appendChild(element('div', 'person-id', personId));
                text.appendChild(element('div', 'person-tag', index === 0 ? 'Just now' : 'Recognised'));
                card.appendChild(image);
                card.appendChild(text);
                grid.appendChild(card);
            });
            return grid;
        }

        function draw(key, build) {
            if (key !== drawnContent) {
                drawnContent = key;
                document.getElementById('content').replaceChildren(build());
            }
        }

        function updateContent(rows) {
            if (isErrorPersisted) {
                draw('error' + errorMessage, () => drawNotice('error', errorMessage));
            } else if (isSuccessPersisted) {
                draw('success' + successMessage, () => drawNotice('success', successMessage));
            } else if (rows.length > 0) {
                draw(JSON.stringify(rows), () => drawPeople(rows));
            } else {
                draw('idle', drawIdle);
            }
        }

        socket.on('new_message', function (data) {
            // Status pushes from the server carry no camera_status, and must leave the strip alone
            if (data.camera_status) {
                updateCameraStatus(data.camera_status);
            }

            const errorMessages = data.message.filter(item => item.hasOwnProperty('ERROR'));
            const successMessages = data.message.filter(item => item.hasOwnProperty('SUCCESS'));

            if (errorMessages.length > 0) {
                errorMessage = errorMessages[0].ERROR;
                isErrorPersisted = true;
                isSuccessPersisted = false; // Clear success flag if an error occurs
                successMessage = ''; // Clear success message if an error occurs
            } else if (successMessages.length > 0) {
                successMessage = successMessages[0].SUCCESS;
                isSuccessPersisted = true;
                isErrorPersisted = false; // Clear error flag if a success occurs
                errorMessage = ''; // Clear error message if a success occurs
                setTimeout(() => {
                    isSuccessPersisted = false;
                }, successMessage === STARTING_MESSAGE ? 120000 : 5000); // 2 minutes for the restart wait, otherwise 5 seconds
            } else if (data.message.length > 0) {
                isErrorPersisted = false;
                errorMessage = ''; // Clear error message if valid data is received
            }

            updateContent(data.message);
            lastUpdate = Date.now(); // Update the last update time
        });

        setInterval(function () {
            socket.emit('check_updates');
        }, 100); // Check for updates every 100 milliseconds (adjust as needed)

        setInterval(function () {
            if (!isErrorPersisted && !isSuccessPersisted && Date.now() - lastUpdate > clearIntervalTime) {
                updateContent([]); // Clear the rows if the server stops answering and no error or success is displayed
            }
        }, 1000); // Check every second if messages should be cleared

        updateContent([]);
    </script>
</body>

</html>
