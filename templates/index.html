<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Display</title>
    <style>
        /* Colours, type and radii match the Face-Dataset-Collector app's light staff theme */
        @font-face {
            font-family: "IBM Plex Sans";
            font-weight: 400;
            src: url("{{ url_for('static', filename='fonts/ibm_plex_sans_regular.ttf') }}");
        }

        @font-face {
            font-family: "IBM Plex Sans";
            font-weight: 500;
            src: url("{{ url_for('static', filename='fonts/ibm_plex_sans_medium.ttf') }}");
        }

        @font-face {
            font-family: "IBM Plex Sans";
            font-weight: 600;
            src: url("{{ url_for('static', filename='fonts/ibm_plex_sans_semibold.ttf') }}");
        }

        :root {
            --ink: #14202b;
            --ink-muted: #46535f;
            --ground: #f3f5f7;
            --surface: #ffffff;
            --line: #d5dbe1;
            --face-ground: #e7ebef;
            --accent: #0b5f63;
            --error: #a32019;
            --warning-fill: #fce9c8;
            --warning-text: #7a3e00;
            --success-fill: #d3f1e5;
            --success-text: #0a4d3c;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            background: var(--ground);
            color: var(--ink);
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        }

        /* Sizes use vh so that the layout holds at any kiosk resolution */
        .screen {
            box-sizing: border-box;
            height: 100%;
            padding: 4.4vh 3.4vw;
            display: flex;
            flex-direction: column;
            gap: 3vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2vw;
        }

        .prompt {
            display: flex;
            align-items: center;
            gap: 1.2vw;
        }

        .prompt svg {
            width: 5.2vh;
            height: 5.2vh;
            flex: none;
        }

        h1 {
            margin: 0;
            font-size: 5.2vh;
            font-weight: 600;
            line-height: 1.15;
        }

        .location {
            font-size: 3vh;
            font-weight: 500;
            color: var(--ink-muted);
        }

        /* One line at the foot of the screen, so any number of camera problems takes the same space from the person cards */
        #camera-status {
            flex: none;
            overflow: hidden;
        }

        #camera-status:empty {
            display: none;
        }

        .chips {
            display: flex;
            gap: 1.2vw;
            width: max-content;
            padding-left: 100%;
            white-space: nowrap;
            animation: marquee linear infinite;
        }

        @keyframes marquee {
            to {
                transform: translateX(-100%);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .chips {
                flex-wrap: wrap;
                width: auto;
                padding-left: 0;
                white-space: normal;
                animation: none;
            }
        }

        .chip {
            flex: none;
            box-sizing: border-box;
            padding: 1.1vh 1vw;
            border-radius: 6px;
            font-size: 2.6vh;
            font-weight: 600;
            line-height: 1.3;
        }

        .chip-error {
            background: var(--warning-fill);
            color: var(--warning-text);
        }

        .chip-success {
            background: var(--success-fill);
            color: var(--success-text);
        }

        main {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .people {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: repeat(2, minmax(0, 1fr)); /* Fixed, or one or two cards fill the height and the portrait squeezes out the name */
            grid-auto-rows: minmax(0, 1fr);
            gap: 3vh;
        }

        /* Clockwise: the newest is top left, and the oldest sits bottom left, the next to leave */
        .people > .person:nth-child(3) {
            grid-area: 2 / 2;
        }

        .people > .person:nth-child(4) {
            grid-area: 2 / 1;
        }

        .person {
            min-width: 0;
            min-height: 0;
            box-sizing: border-box;
            padding: 3vh;
            display: flex;
            align-items: center;
            gap: 2vw;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
        }

        .person img {
            height: min(100%, 20vw); /* Width too, or a tall screen squeezes out the name */
            aspect-ratio: 1;
            flex: none;
            box-sizing: border-box;
            object-fit: cover;
            background: var(--face-ground);
            border: 0.3vh solid var(--line);
            border-radius: 8px;
        }

        .person.newest img {
            border-color: var(--accent);
        }

        .person-text {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 1.1vh;
        }

        .person-id {
            font-size: min(7vh, 4vw);
            font-weight: 600;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
            white-space: nowrap; /* fitName shrinks it to one line */
        }

        .person-id.wrap {
            white-space: normal;
            overflow-wrap: anywhere; /* Breaks after an underscore first, mid-word only if one part still does not fit */
        }

        .person-name {
            font-size: min(3.6vh, 2.2vw);
            font-weight: 500;
            color: var(--ink-muted);
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-clamp: 2; /* Two lines, then an ellipsis: the ID above tells people apart, so a cut name hides nothing that matters */
            overflow: hidden;
            overflow-wrap: break-word; /* Only a single word too long for the line breaks inside */
        }

        .person-tag {
            font-size: 2.4vh;
            font-weight: 500;
            color: var(--ink-muted);
        }

        .person.newest .person-tag {
            font-weight: 600;
            color: var(--accent);
        }

        .centred {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3.7vh;
            text-align: center;
        }

        .face-guide {
            width: 27.8vh;
            height: 35.2vh;
            box-sizing: border-box;
            border: 0.6vh solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .face-guide svg {
            width: 14vh;
            height: 14vh;
        }

        .idle-text {
            font-size: 4vh;
            font-weight: 500;
            color: var(--ink-muted);
        }

        .notice {
            box-sizing: border-box;
            max-width: 78vw;
            padding: 6vh 3.8vw;
            border-radius: 8px;
            font-size: 5.2vh;
            font-weight: 600;
            line-height: 1.3;
            text-wrap: balance;
        }

        .notice-error {
            background: var(--error);
            color: #ffffff;
        }

        .notice-info {
            background: var(--surface);
            border: 1px solid var(--line);
            color: var(--ink-muted);
        }

        .notice-success {
            background: var(--success-fill);
            color: var(--success-text);
        }

        .progress {
            width: 47vw;
            height: 1.5vh;
            border-radius: 0.75vh;
            background: var(--line);
            overflow: hidden;
        }

        .progress div {
            height: 100%;
            border-radius: 0.75vh;
            background: var(--accent);
            animation: fill 120s linear forwards;
        }

        @keyframes fill {
            from {
                width: 0;
            }

            to {
                width: 100%;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>

<body>
    <div class="screen">
        <header>
            <div class="prompt">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#0b5f63" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 8a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <path d="M16 10.5 21 8v8l-5-2.5"></path>
                </svg>
                <h1>Please look into the camera</h1>
            </div>
            <div class="location">{{ location }}</div>
        </header>
        <main id="content"></main>
        <div id="camera-status"></div>
    </div>

    <script type="text/javascript">
        // Must match the text in app.py exactly: it holds this message for 2 minutes
        const STARTING_MESSAGE = "Facial Recognition Attendance System is Getting Started. Please Wait for 2 Minutes";

        const socket = io.connect(); // Same origin, so it works on plain HTTP and behind an HTTPS proxy
        let lastUpdate = Date.now();
        const clearIntervalTime = 15000; // 15 seconds
        let screenStatus = null; // The ERROR, SUCCESS or INFO status the server says is in force, or null to show the rows
        let names = {}; // Person ID to name; an ID with no name shows alone
        let successUntil = 0; // When the green status ends, so a reloaded page resumes it instead of starting it again
        let drawnContent = null; // The server repeats itself every 100 ms: redraw only on a change, or the progress bar restarts
        let drawnStatus = null; // The same goes for the marquee

        function element(tag, className, text) {
            const node = document.createElement(tag);
            node.className = className;
            if (text !== undefined) {
                node.textContent = text;
            }
            return node;
        }

        function updateCameraStatus(statuses) {
            const key = JSON.stringify(statuses);
            if (key === drawnStatus) {
                return;
            }
            drawnStatus = key;
            const strip = document.getElementById('camera-status');
            strip.replaceChildren();
            if (statuses.length > 0) {
                const chips = element('div', 'chips');
                chips.replaceChildren(...statuses.map(status =>
                    element('div', status.level === 'ERROR' ? 'chip chip-error' : 'chip chip-success', status.text)
                ));
                strip.appendChild(chips);
                chips.style.animationDuration = chips.offsetWidth / (window.innerHeight * 0.15) + 's'; // Same reading speed however many cameras are listed
            }
        }

        function drawNotice(type, text) {
            const area = element('div', 'centred');
            area.appendChild(element('div', 'notice notice-' + type, text));
            if (text === STARTING_MESSAGE) {
                const progress = element('div', 'progress');
                const bar = element('div', '');
                bar.style.animationDelay = -Math.max(0, 120 - (successUntil - Date.now()) / 1000) + 's'; // Resumes a bar already part filled
                progress.appendChild(bar);
                area.appendChild(progress);
            }
            return area;
        }

        function drawIdle() {
            const area = element('div', 'centred');
            const guide = element('div', 'face-guide');
            guide.innerHTML = '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="#d5dbe1" stroke-width="1.2" stroke-linecap="round"><circle cx="12" cy="8.5" r="4.5"></circle><path d="M4 21c1.2-4.4 4.2-6.5 8-6.5s6.8 2.1 8 6.5"></path></svg>';
            area.appendChild(guide);
            area.appendChild(element('div', 'idle-text', 'Ready for the next person'));
            return area;
        }

        // Each draws its silhouette at 3.7:1 or better against its ground
        const SILHOUETTE_HUES = [0, 30, 140, 200, 230, 260, 290, 330];

        // A person with no photo gets a silhouette coloured from their ID, so the same person usually looks the same.
        // A colour already on screen moves to the next free one, so no two cards share it
        function silhouette(personId, used) {
            let hash = 0;
            for (const character of personId) {
                hash = (hash * 31 + character.codePointAt(0)) >>> 0;
            }
            let index = hash % SILHOUETTE_HUES.length;
            while (used.has(index)) {
                index = (index + 1) % SILHOUETTE_HUES.length;
            }
            used.add(index);
            const hue = SILHOUETTE_HUES[index];
            const ink = `hsl(${hue},30%,38%)`;
            return 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><rect width="256" height="256" fill="hsl(${hue},45%,90%)"/><circle cx="128" cy="100" r="52" fill="${ink}"/><ellipse cx="128" cy="250" rx="95" ry="80" fill="${ink}"/></svg>`);
        }

        function drawPeople(rows) {
            const grid = element('div', 'people');
            const usedHues = new Set(); // At most 4 cards, so a free colour always remains
            rows.forEach((row, index) => {
                const personId = Object.keys(row)[0];
                const card = element('div', index === 0 ? 'person newest' : 'person');
                card.dataset.id = personId;
                const image = element('img', '');
                const photo = row[personId];
                image.src = typeof photo === 'string' && photo ? "data:image/jpg;base64," + photo : silhouette(personId, usedHues); // The image server sends null for a missing photo
                image.alt = '';
                const text = element('div', 'person-text');
                text.appendChild(element('div', 'person-id', personId.replaceAll('_', '_\u200B'))); // Zero-width space: a break point after each underscore, not <wbr>, which Chrome breaks at even under nowrap
                if (names[personId]) {
                    text.appendChild(element('div', 'person-name', names[personId]));
                }
                text.appendChild(element('div', 'person-tag', index === 0 ? 'Just now' : 'Recognised'));
                card.appendChild(image);
                card.appendChild(text);
                grid.appendChild(card);
            });
            return grid;
        }

        // Shrinks a name to fit one line, down to half size; past that it wraps at underscores
        function fitName(name) {
            name.style.fontSize = '';
            name.classList.remove('wrap');
            if (name.scrollWidth <= name.clientWidth) {
                return;
            }
            const size = parseFloat(getComputedStyle(name).fontSize);
            let fit = Math.floor(size * name.clientWidth / (name.scrollWidth + 1)); // + 1 because scrollWidth is rounded
            name.style.fontSize = Math.max(fit, size / 2) + 'px';
            while (fit >= size / 2 && name.scrollWidth > name.clientWidth) { // Text width is not quite proportional to size
                fit -= 1;
                name.style.fontSize = Math.max(fit, size / 2) + 'px';
            }
            name.classList.toggle('wrap', fit < size / 2);
        }

        function fitNames() {
            document.querySelectorAll('.people .person-id').forEach(fitName); // Not a leaving card, which is fading out
        }

        window.addEventListener('resize', fitNames);
        document.fonts.addEventListener('loadingdone', fitNames); // The font file changes text widths when it arrives

        function draw(key, build) {
            if (key === drawnContent) {
                return false;
            }
            drawnContent = key;
            document.getElementById('content').replaceChildren(build());
            fitNames();
            return true;
        }

        function shownCards() {
            return new Map([...document.querySelectorAll('.people > .person')].map(card => [card.dataset.id, { card, place: card.getBoundingClientRect() }]));
        }

        // Each person glides from their old place to the new one, a new person fades in, and the one leaving fades out where it stood
        function moveCards(before) {
            if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
                return;
            }
            const timing = { duration: 300, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' };
            const after = shownCards();
            after.forEach(({ card, place }, id) => {
                const old = before.get(id);
                if (!old) {
                    card.animate([{ opacity: 0, transform: 'scale(0.96)' }, { opacity: 1, transform: 'none' }], timing);
                    return;
                }
                const x = old.place.left - place.left;
                const y = old.place.top - place.top;
                if (x || y) {
                    card.animate([{ transform: `translate(${x}px, ${y}px)` }, { transform: 'none' }], timing);
                }
            });
            before.forEach(({ card, place }, id) => {
                if (!after.has(id)) {
                    Object.assign(card.style, { position: 'fixed', margin: 0, left: place.left + 'px', top: place.top + 'px', width: place.width + 'px', height: place.height + 'px', pointerEvents: 'none' });
                    document.body.appendChild(card);
                    card.animate([{ opacity: 1 }, { opacity: 0, transform: 'scale(0.96)' }], timing).onfinish = () => card.remove();
                }
            });
        }

        function updateContent(rows) {
            if (screenStatus) {
                const { level, text } = screenStatus;
                draw(level + text, () => drawNotice(level.toLowerCase(), text));
            } else if (rows.length > 0) {
                const before = shownCards();
                if (draw(JSON.stringify([rows, names]), () => drawPeople(rows))) {
                    moveCards(before);
                }
            } else {
                draw('idle', drawIdle);
            }
        }

        function showMessage(data) {
            // Status pushes from the server carry no camera_status, and must leave the strip alone
            if (data.camera_status) {
                updateCameraStatus(data.camera_status);
            }

            // The server sends the screen as it is on every poll, so the page draws exactly that and keeps no state of its own
            const item = data.message[0];
            const level = item && ['ERROR', 'SUCCESS', 'INFO'].find(key => key in item);
            screenStatus = level ? { level, text: item[level] } : null;
            if (level === 'SUCCESS') {
                successUntil = Date.now() + (data.status_seconds || 5) * 1000; // Places the 2 minute bar on a page that loads late
            }

            names = data.names || {}; // Older servers send none
            updateContent(level ? [] : data.message);
            lastUpdate = Date.now();
        }

        socket.on('new_message', showMessage);

        // Without the server nothing is known, as when it restarts, so say so instead of looking idle
        function connectionLost() {
            screenStatus = { level: 'ERROR', text: 'Network Issue: Unable to Connect to the Server' };
            updateContent([]);
        }

        socket.on('disconnect', connectionLost);

        setInterval(function () {
            socket.emit('check_updates');
        }, 100); // Check for updates every 100 milliseconds (adjust as needed)

        setInterval(function () {
            if (Date.now() - lastUpdate > clearIntervalTime) {
                connectionLost(); // The server stopped answering polls; it clears the rows itself when nobody comes
            }
        }, 1000);

        showMessage({{ state | tojson }}); // The screen as the server had it when it sent this page
    </script>
</body>

</html>
