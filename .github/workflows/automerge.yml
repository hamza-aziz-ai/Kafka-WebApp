name: automerge

# Squash-merges every open PR into main, and deletes its branch, once every check on its latest commit
# has passed.
#
# Never triggered by pull_request: workflow_run and workflow_dispatch always run the copy of this file on
# main, so a PR cannot rewrite the rule that merges it.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  # Only to start release.yml after a merge.
  actions: write

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  # A cancelled job (runner hiccup or job time limit) would leave its PR stuck: automerge skips anything that did
  # not pass, and nothing starts ci again. One retry, so a job that really hangs still fails. Real failures stay failed.
  retry:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Re-run cancelled jobs once, if their commit is still the head of an open PR
        run: |
          set -euo pipefail
          # A new push also cancels the old run, on purpose: that commit is no longer any PR's head.
          heads=$(gh pr list --base main --state open --limit 100 --json headRefOid --jq '.[].headRefOid')
          if ! grep -qxF "$HEAD_SHA" <<<"$heads"; then echo "$HEAD_SHA is not the head of an open PR; skip."; exit 0; fi
          cancelled=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion == "cancelled")] | length')
          if [ "$cancelled" -eq 0 ]; then echo "No cancelled job: a real failure, not retried."; exit 0; fi
          echo "$cancelled cancelled job(s) in run $RUN_ID; re-running the failed jobs."
          gh run rerun "$RUN_ID" --failed

  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Merge every ready PR whose head commit passed all checks
        run: |
          set -euo pipefail
          # Every skip prints the checks it saw, so a PR left unmerged shows why.
          skip() { echo "#$pr: $1 on $sha; skip. Checks seen:"; sed 's/^/    /' <<<"${checks:-none}"; }
          sweep() {
            merged=0
            # Open, non-draft PRs into main from this repository (forks are never merged).
            while read -r pr sha; do
              # A check with a conclusion is finished: GitHub has left passed checks stuck on in_progress.
              checks=$(gh api --paginate "repos/$GH_REPO/commits/$sha/check-runs?per_page=100" \
                --jq '.check_runs[] | "\(if .conclusion then "completed" else .status end) \(.conclusion // "none") \(.name)"')
              # The aggregate ci check must exist and have passed; a PR with no checks is never merged.
              if ! grep -qx 'completed success ci' <<<"$checks"; then skip "no successful ci"; continue; fi
              if grep -qv '^completed ' <<<"$checks"; then skip "checks still running"; continue; fi
              if grep -Ev '^completed (success|skipped|neutral) ' <<<"$checks" | grep -q .; then
                skip "a check did not pass"; continue
              fi
              # --match-head-commit refuses the merge if a newer commit was pushed after these checks ran.
              if gh pr merge "$pr" --squash --delete-branch --match-head-commit "$sha"; then
                echo "#$pr: merged at $sha."; merged=$((merged + 1))
              else
                echo "::warning::#$pr: merge refused (new commit, conflict or permissions); the next ci run retries."
              fi
            done < <(gh pr list --base main --state open --limit 100 \
              --json number,headRefOid,isDraft,isCrossRepository \
              --jq '.[] | select(.isDraft | not) | select(.isCrossRepository | not) | "\(.number) \(.headRefOid)"')
          }
          # A merge deletes its branch and GitHub retargets PRs stacked on it to main without re-running ci;
          # after any merge, give the retarget a moment and sweep again (bounded) so the stack drains.
          total=0
          for _ in 1 2 3 4 5; do
            sweep
            total=$((total + merged))
            [ "$merged" -gt 0 ] || break
            sleep 20
          done
          # Merges made with GITHUB_TOKEN start no push workflows, but workflow_dispatch is allowed:
          # hand over to release.yml, which decides whether the merged titles call for a version bump.
          if [ "$total" -gt 0 ]; then gh workflow run release.yml --ref main; fi
