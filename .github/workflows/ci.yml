name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Reused by the release workflow so images are only published from a commit that passed these checks
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Syntax errors and undefined names only
      - run: pipx run ruff==0.17.3 check --select E9,F63,F7,F82 --target-version py314 --output-format github .

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ci/kafka-webapp:test
          load: true
          push: false
      # Dependencies resolve, and the app loads its settings from the environment
      - name: Smoke test
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" -e IP_ADDRESS=10.0.0.1 -e PROJECT_SERVICES_PORT=1,2 ci/kafka-webapp:test sh -c '
            set -e
            pip check
            python3 -c "import confluent_kafka, flask_socketio, requests, parameters as p; assert p.SERVER_IP_ADDRESS == \"10.0.0.1\" and p.PROJECT_SERVICES_PORT == [1, 2]"
          '

  # Single check that automerge requires; fails if any job failed or was cancelled
  ci:
    if: always()
    needs: [lint, secrets, image]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
