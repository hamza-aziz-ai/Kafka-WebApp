name: release

# Tags and publishes a GitHub Release when the commits merged since the last release call for a version bump
#. Squash merges make each commit subject a PR title, read as a Conventional Commit:
#   type!: or a "BREAKING CHANGE" footer -> major, feat -> minor, fix/perf -> patch, anything else -> no release.
# automerge starts this workflow after it merges (workflow_dispatch is an event GITHUB_TOKEN may start; its
# merges start no push workflows). It can also be run by hand, optionally forcing the bump.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump; auto reads the merged commit titles
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

# A running release is never cancelled; a queued one plans again from the tags as they are by then.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          subjects=$(git log --format=%s "${last:+$last..}HEAD")
          bodies=$(git log --format=%b "${last:+$last..}HEAD")
          if [ "$BUMP" = auto ]; then
            if grep -qE '^[a-z]+(\([^)]*\))?!:' <<<"$subjects" || grep -q '^BREAKING CHANGE' <<<"$bodies"; then BUMP="major"
            elif grep -qE '^feat(\([^)]*\))?:' <<<"$subjects"; then BUMP="minor"
            elif grep -qE '^(fix|perf)(\([^)]*\))?:' <<<"$subjects"; then BUMP="patch"
            else
              echo "No feat, fix, perf or breaking change since ${last:-the first commit}; nothing to release."
              echo "tag=" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          IFS=. read -r major minor patch <<<"${last:-v0.0.0}"; major=${major#v}
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          tag="v$major.$minor.$patch"
          echo "Releasing $tag ($BUMP) at $GITHUB_SHA; previous: ${last:-none}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # The PR already passed ci, so only the merged commit is tested here, once, in the image that ships: a squash
  # merge is a new commit. amd64 is built and checked first; the push reuses that build and adds arm64.
  # Built for PCs and Raspberry Pis, and pushed before the tag exists so a release is never published without them.
  images:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          tags: release/kafka-webapp:test
          load: true
          push: false
      - name: Broker-free checks
        run: |
          docker run --rm release/kafka-webapp:test sh -c 'pip check && python3 test_partitions.py'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/hamza-aziz-ai/kafka-webapp:${{ needs.plan.outputs.tag }}
          push: true

  publish:
    needs: [plan, images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag and publish
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
